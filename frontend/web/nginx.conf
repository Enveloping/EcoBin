map $http_x_forwarded_proto $ecobin_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_real_ip $ecobin_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_host $ecobin_forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_x_forwarded_port $ecobin_forwarded_port {
    default $http_x_forwarded_port;
    ""      $server_port;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 微信普通二维码校验文件位于 device-entry/ 目录。精确访问目录入口时直接
    # 返回 SPA 首页，避免 try_files 把真实目录判定为终点后产生 403。
    location = /device-entry/ {
        try_files /index.html =404;
    }

    # 前端是 SPA（react-router）：找不到的真实文件一律回退到 index.html，
    # 否则刷新 /tenant 这类前端路由会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源反代：浏览器请求的 /api/* 由 nginx 转发到 compose 网络里的 backend 容器。
    # 用服务名 backend 是因为它们在同一 docker network，DNS 能解析到后端容器。
    # proxy_pass 不带尾部 URI，原始路径（含 /api）原样透传给后端。
    location ~ "^/api/v1/web/platform/business-releases/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/artifacts$" {
        client_max_body_size 1537m;
        client_body_timeout 1900s;
        proxy_request_buffering off;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ecobin_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $ecobin_forwarded_host;
        proxy_set_header X-Forwarded-Proto $ecobin_forwarded_proto;
        proxy_set_header X-Forwarded-Port $ecobin_forwarded_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 1900s;
        proxy_read_timeout 1900s;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ecobin_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $ecobin_forwarded_host;
        proxy_set_header X-Forwarded-Proto $ecobin_forwarded_proto;
        proxy_set_header X-Forwarded-Port $ecobin_forwarded_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
    }
}
