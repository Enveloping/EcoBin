# Copy this file to:
#   .ecobin/application-local-secrets.yml
#
# Keep the keys at the top level. The local PowerShell tools intentionally
# support this small, easy-to-audit YAML subset. The destination is Git-ignored.

# Local Docker MySQL. The backend itself ignores these two keys.
localMysqlDatabase: 'ecobin'
localMysqlRootPassword: 'replace-with-a-local-random-password'

# Backend database connection used by IDEA and run-backend.ps1.
dbUrl: 'jdbc:mysql://127.0.0.1:13306/ecobin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai'
dbUsername: 'ecobin_app'
dbPassword: 'replace-with-the-runtime-database-password'

# Backend signing and field encryption.
jwtSecret: 'replace-with-at-least-32-random-bytes'
appAesKey: 'replace-with-a-valid-aes-key'

# Local Fake masks every channel value below. Local Real requires them.
wechatAppid: ''
wechatSecret: ''

cosSecretId: ''
cosSecretKey: ''
cosRegion: 'ap-shanghai'
cosBucketName: ''
cosBaseUrl: ''
cosDurationSeconds: '1800'

iotAccessId: ''
iotSecretKey: ''
iotSubscriptionName: ''
onenetProductId: ''
onenetAccessKey: ''

# Only used when Local Fake creates the first platform administrator.
defaultPlatformAdminLogin: 'admin'
defaultPlatformAdminPassword: 'admin123'
defaultPlatformAdminDisplayName: '开发平台管理员'
