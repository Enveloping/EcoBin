  "semanticRules": [
    {
      "id": "MEASUREMENT_STATUS_VALIDITY",
      "kind": "MEASUREMENT_VALIDITY",
      "messages": [
        "WORK_PREOPEN_WEIGHT_READY",
        "WORK_POSTCLOSE_WEIGHT_READY",
        "WORK_PREUNLOCK_WEIGHT_READY",
        "CLEAN_FINAL_WEIGHT_READY",
        "FULLNESS_SAMPLE_RESULT",
        "BASELINE_MEASUREMENT_RESULT",
        "STATE_SNAPSHOT_PORT"
      ],
      "notes": "STABLE 当且仅当 stableWeightValid=true、weightSensorHealth=OK、faultCode=NONE；无效固定槽全零。失败状态必须 stableWeightValid=false 且使用相匹配的 health/fault；lastObservedWeightValid=false 时固定槽全零。"
    },
    {
      "id": "CLEAN_LOCK_POWER_INFERENCE",
      "kind": "CLEAN_LOCK_INFERENCE",
      "messages": [
        "STATE_SNAPSHOT_PORT",
        "CLEAN_COMPLETION_CONFIRMED"
      ],
      "notes": "health=OK 且 ENERGIZED 推定 OPEN，health=OK 且 DEENERGIZED 推定 CLOSED；锁状态未知或 health 非 OK 只能推定 UNKNOWN；stateBasis 恒为 INFERRED_FROM_LOCK_POWER。"
    },
    {
      "id": "HELLO_AND_NACK_OUTCOME",
      "kind": "HELLO_OUTCOME",
      "messages": [
        "HELLO",
        "HELLO_ACK",
        "NACK"
      ],
      "notes": "HELLO capability 不得包含未知位且必须覆盖对应 required mask；HELLO_ACK ACCEPTED 要求 errorCode=NONE、能力为合法交集，INCOMPATIBLE 要求非 NONE；NACK 禁止 NONE。"
    },
    {
      "id": "OPTIONAL_WORK_SCOPE",
      "kind": "WORK_SCOPE",
      "messages": [
        "FAULT_OBSERVED",
        "SAFETY_SENSOR_EVENT",
        "STATE_SNAPSHOT_BEGIN"
      ],
      "notes": "FAULT_OBSERVED/SAFETY_SENSOR_EVENT 仅要求 workType=NONE 当且仅当 workUid 为全零；portNo 独立表示故障作用域，可为设备级 0 或真实投口。STATE_SNAPSHOT_BEGIN 的 NONE 状态使用全零 workUid、portNo=0、IDLE；CONFIG_APPLICATION 使用非零 workUid、portNo=0、CONFIG_STAGING；其他活动作业使用非零 workUid 和真实投口。"
    },
    {
      "id": "SAFE_CLOSE_SCOPE_PORT",
      "kind": "SAFE_CLOSE_SCOPE",
      "messages": [
        "SAFE_CLOSE",
        "SAFE_CLOSE_RESULT"
      ],
      "notes": "ALL_DELIVERY_DOORS 只在命令中使用 portNo=0；SINGLE_DELIVERY_DOOR 与每条结果均使用真实 1..portCount。"
    },
    {
      "id": "SAFE_CLOSE_RESULT_MATRIX",
      "kind": "SAFE_CLOSE_RESULT_OUTCOME",
      "messages": [
        "SAFE_CLOSE_RESULT"
      ],
      "notes": "成功结果必须为 doorState=CLOSED、doorHealth=OK、faultCode=NONE；TIMEOUT 对应 DELIVERY_DOOR_TIMEOUT，ACTUATOR_FAULT 对应 DELIVERY_DOOR_ACTUATOR，SWITCH_FAULT 或 DISCONNECTED 对应 DELIVERY_DOOR_SWITCH，故障结果不得声称 CLOSED+OK。"
    },
    {
      "id": "UART_FAULT_COMPONENT_CODE",
      "kind": "FAULT_COMPONENT_CODE",
      "messages": [
        "FAULT_OBSERVED"
      ],
      "notes": "faultCode 禁止 NONE，且必须属于 component：UART→UART_PROTOCOL/UART_STORAGE；DELIVERY_DOOR→DELIVERY_DOOR_TIMEOUT/ACTUATOR/SWITCH；CLEAN_SOLENOID→CLEAN_SOLENOID_DRIVER；WEIGHT_SENSOR→WEIGHT_UNSTABLE/TIMEOUT/SENSOR/OVERLOAD；INFRARED_SENSOR→INFRARED_TIMEOUT/SENSOR；SMOKE_SENSOR→SMOKE_SENSOR；MCU_STORAGE→MCU_STORAGE；MCU_INTERNAL→MCU_INTERNAL。"
    },
    {
      "id": "SENSOR_VALUE_HEALTH_MATRIX",
      "kind": "SENSOR_VALUE_HEALTH",
      "messages": [
        "FULLNESS_SAMPLE_RESULT",
        "SAFETY_SENSOR_EVENT",
        "STATE_SNAPSHOT_PORT"
      ],
      "notes": "infraredHealth=OK 时 infraredValue 只能 CLEAR/BLOCKED，非 OK 时必须 UNKNOWN；smokeSensorHealth=OK 时 smokeState 只能 NORMAL/ALARM，非 OK 时必须 UNKNOWN。SAFETY_SENSOR_EVENT 的健康正常值使用 faultCode=NONE，传感器非 OK 使用 faultCode=SMOKE_SENSOR。FULLNESS_SAMPLE_RESULT 的 faultCode 仍只描述同消息的称重结果，不用红外故障覆盖。"
    },
    {
      "id": "CONFIG_SEGMENT_SET",
      "kind": "CONFIG_SEGMENTS",
      "messages": [
        "CONFIG_BEGIN",
        "CONFIG_DEVICE_BLOCK",
        "CONFIG_PORT_BLOCK",
        "CONFIG_COMMIT"
      ],
      "notes": "同一 application/version/content/mcuPayload 摘要组成 BEGIN、DEVICE、按 portNo 连续有序的 PORT、COMMIT；partCount=expectedPortCount+3，partIndex 与端口严格对应。"
    },
    {
      "id": "SNAPSHOT_SEGMENT_SET",
      "kind": "SNAPSHOT_SEGMENTS",
      "messages": [
        "STATE_SNAPSHOT_BEGIN",
        "STATE_SNAPSHOT_PORT",
        "STATE_SNAPSHOT_END"
      ],
      "notes": "同一 snapshotUid 恰有 BEGIN、portCount 个连续有序 PORT 与 END；partCount=portCount+2；仅完整集合且 snapshotSha256 一致可用于恢复。appliedConfigVersion=0 当且仅当两个 applied SHA 全零；大于 0 时二者均非零。stagingValid=false 时全部 staging 字段全零；为 true 时 applicationUid/SHA 非零、configVersion>=1、stagingPartCount=portCount+3 且为 4..9，bitmap 的 bit n 对应 partIndex=n+1、bit0=1、超出 stagingPartCount 的位为 0。"
    },
    {
      "id": "SNAPSHOT_PORT_FAULT_SUMMARY",
      "kind": "SNAPSHOT_PORT_FAULT_BITMAP",
      "messages": [
        "STATE_SNAPSHOT_PORT"
      ],
      "notes": "faultBitmap 仅使用 PortFaultBitmap 已登记的 bit 0..4，保留位必须为 0；每一位严格由对应 health 是否为 OK 派生，不代替类型化 health/fault 事实。"
    },
    {
      "id": "CLEAN_FINISH_GENERATION",
      "kind": "CLEAN_COMPLETION_GENERATION",
      "messages": [
        "CLEAN_UNLOCK_REQUESTED",
        "UNLOCK_CLEAN_DOOR",
        "CLEAN_FINISH_REQUESTED",
        "CLEAN_FINAL_WEIGHT_READY",
        "CLEAN_COMPLETION_CONFIRMED"
      ],
      "notes": "cleanActionSequence 在再次解锁与完成请求间严格递增；完成确认必须绑定同代最终 measurementUid，任何更大序号解锁都会作废旧候选。"
    },
    {
      "id": "DELIVERY_POSTCLOSE_SELECTION_ORDER",
      "kind": "DELIVERY_SELECTION_ORDER",
      "messages": [
        "WORK_POSTCLOSE_WEIGHT_READY",
        "DELIVERY_SELECTION"
      ],
      "notes": "选择事件必须精确绑定已持久 ACK 的 postCloseMeasurementUid；END/WINDOW_EXPIRED 固化最终重量，CONTINUE 获 ACK 后才允许再次开门。"
    }
  ],
