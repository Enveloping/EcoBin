  "recoveryPolicy": [
    "rc.23进入精简正常业务集成，尚非可发布整机。MCU负责本地硬件和按钮状态机，Pi保留业务必要数据；旧逐动作/过程交接及多代机械恢复条目只用于历史候选读取，不接入新正常执行。",
    "MCU每次启动放弃未完成业务，先清输出再自行设置投递CLOSE及清运锁断电；mcuBootId=0仅在RAM，绑定前不接业务，不重建旧执行。CLOSE是控制状态而非实测门位。",
    "香橙派单独重启继续原业务，恢复同一MCU启动下的查询和完整结果保存，不重放START。仅超时不能证明MCU重启；达到明确控制通信故障阈值后当前未完成业务失败、停接单交人工，不无限机械重试。",
    "命令先校验非零目标启动编号；相同启动/序号/UUID/摘要只返回原决定，身份冲突拒绝。已淘汰详情的旧序号不能重新执行；高水位在结果释放后仍保留。序号可因已预留未发送而有空洞，但不能据空洞清除未知动作占用。",
    "MCU保留同一不可变WORK_RESULT直到Pi完整校验并SQLite提交后精确RESULT_SAVED；过程/按钮/动作消息缺失或未确认不阻止本地推进或Pi处理完整结果。保存确认本身不等于云端结算、释放全部占用或可接新业务。",
    "QUERY_WORK 每次先持久分配新 queryId，再单次写入；回复必须完整匹配原查询身份。只读查询不改业务/结果，不重发动作。无回复、过期回复或同查询异文冲突均为未知；NOT_FOUND 只是详情未保留，不能当作未执行。结果引用不替代完整结果保存。",
    "确认MCU重启且Pi没有可靠完整投递最终包时，只归档问题记录，原因为单片机重启、未取得最终结果包；已有重量等事实全部保留，不据过程重建正常结算。归档前已保存完整包优先；归档后迟到完整包核对原身份后只补证，不增加余额/自动提现或覆盖新袋/后续业务。",
    "清运中断且袋状态不明交人工确认，必要时重新换袋并称空袋；不恢复旧机械步骤、不虚构前重或清运量。正常清运按本次前重减后重，后重作为新皮重。",
    "门业务状态依据最近有效推杆方向 01=关、10=开，不是实测门位；施加的输出另报。PB5 仅暂停关门并在释放后继续，开门忽略；PB4 未接，PB5 不单独证明到位或故障。DEVICE_FACTS_REPLY已有同一次控制刷新事实候选，旧多包快照/真实UART接线未完成。",
    "称重250ms目标，最近5点跨度不超过100g取均值，最长5s按既定有效点中位数；不做自动校准。始终不可读时本次失败，新真实读数恢复前停接单提示人工，恢复只允许新业务、旧失败不改。非重启最终称重失败保留系统异常审核，不自动给钱。",
    "START即授权一次本地业务，不再分离首次开门授权；清运真实人工结束意图一次锁存，之后MCU称重/锁断电并冻结结果，不伪造第二次按键。MCU不新增Flash结果日志。新正常结果生产/分类要求有效首末重，通用解码仍保留旧已保存缺测包，旧v1报告保持原文。",
    "烟感/测距/相机采集失败及烟雾报警只提示，不单独阻断。必要存储损坏停接单交人工。仅断网且MCU/存储正常时原业务完成并待补报，离线不接新业务；连续离线超过10分钟后台释放用户/设备占用，但保留原结果身份和补报，不转成问题归档。"
