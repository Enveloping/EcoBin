    },
    {
      "id": "HELLO_AND_NACK_OUTCOME",
      "kind": "HELLO_OUTCOME",
      "messages": [
        "HELLO",
        "HELLO_ACK",
        "NACK"
      ],
      "notes": "HELLO capability 不得包含未知位且必须覆盖对应 required mask；HELLO_ACK ACCEPTED 要求 errorCode=NONE、能力为合法交集，INCOMPATIBLE 要求非 NONE；NACK 禁止 NONE。"
    },
    {
      "id": "OPTIONAL_WORK_SCOPE",
      "kind": "WORK_SCOPE",
      "messages": [
        "FAULT_OBSERVED",
        "SAFETY_SENSOR_EVENT",
        "STATE_SNAPSHOT_BEGIN"
      ],
      "notes": "FAULT_OBSERVED/SAFETY_SENSOR_EVENT 仅要求 workType=NONE 当且仅当 workUid 为全零；portNo 独立表示故障作用域，可为设备级 0 或真实投口。STATE_SNAPSHOT_BEGIN 的 NONE 状态使用全零 workUid、portNo=0、IDLE；CONFIG_APPLICATION 使用非零 workUid、portNo=0、CONFIG_STAGING；其他活动作业使用非零 workUid 和真实投口。"
    },
    {
      "id": "SAFE_CLOSE_SCOPE_PORT",
      "kind": "SAFE_CLOSE_SCOPE",
      "messages": [
        "SAFE_CLOSE",
        "SAFE_CLOSE_RESULT"
      ],
      "notes": "ALL_DELIVERY_DOORS 只在命令中使用 portNo=0；SINGLE_DELIVERY_DOOR 与每条结果均使用真实 1..portCount。"
    },
    {
      "id": "DELIVERY_DOOR_COMMAND_OUTPUT_MATRIX",
      "kind": "DOOR_COMMAND_RESULT",
      "messages": [
        "DELIVERY_DOOR_COMMAND_RESULT",
        "SAFE_CLOSE_RESULT"
      ],
      "notes": "physicalDoorStateBasis 恒为 NOT_OBSERVABLE。COMMAND_DISPATCHED 表示经过 100 ms 的 0/0 换向死区后，目标 OPEN/CLOSE 方向已经锁存并将保持到相反命令或复位；它不证明机械动作完成。COMMAND_SUPERSEDED_BEFORE_DISPATCH 表示尚在死区中的命令被更高优先级 CLOSE 取代；COMMAND_DISPATCHED、COMMAND_SUPERSEDED_BEFORE_DISPATCH 与 COALESCED_WITH_EXISTING_CLOSE 使用 faultCode=NONE。OUTPUT_REJECTED 对应 DELIVERY_DOOR_OUTPUT_REJECTED 或 DELIVERY_DOOR_HIL_NOT_QUALIFIED。"
    },
    {
      "id": "UART_FAULT_COMPONENT_CODE",
      "kind": "FAULT_COMPONENT_CODE",
      "messages": [
        "FAULT_OBSERVED"
      ],
      "notes": "faultCode 禁止 NONE，且必须属于 component：UART→UART_PROTOCOL/UART_STORAGE；DELIVERY_DOOR→OUTPUT_INTERRUPTED/OUTPUT_REJECTED/HIL_NOT_QUALIFIED；CLEAN_SOLENOID→CLEAN_SOLENOID_DRIVER；WEIGHT_SENSOR→UNSTABLE/TIMEOUT/SENSOR/OVERLOAD/PROTOCOL/CONFIG/DISCONNECTED；FULLNESS_SENSOR 仅允许真正的驱动诊断，不得把无回波或样本不足上升为故障；SMOKE_SENSOR→SMOKE_SENSOR；MCU_STORAGE→MCU_STORAGE；MCU_INTERNAL→MCU_INTERNAL。"
    },
