        { "name": "stagingReceivedPartBitmap", "type": "u16", "invalidWhen": "stagingValid=false", "invalidEncoding": "all-zero bytes", "notes": "stagingValid=true 时 bit n 表示 partIndex=n+1 已完整持久化；bit 0 必须为 1；索引大于 stagingPartCount 的位必须为 0" },
        { "name": "portCount", "type": "u8", "minimum": 1, "maximum": 6 },
        { "name": "partIndex", "type": "u8", "const": 1 },
        { "name": "partCount", "type": "u8", "minimum": 3, "maximum": 8 },
