      ],
      "notes": "MEASURED_MEDIAN 必须有代表距离；距离小于配置阈值为 BLOCKED，否则 CLEAR。NO_ECHO_CLEAR_FALLBACK 或 INSUFFICIENT_VALID_SAMPLES_CLEAR_FALLBACK 必须为 CLEAR 且代表距离槽无效，不形成故障。满溢事件中的 faultCode 只描述同消息的称重结果。MQ-2 的报警和故障始终只上报，不阻断作业。"
    },
    {
      "id": "CONFIG_SEGMENT_SET",
      "kind": "CONFIG_SEGMENTS",
      "messages": [
        "CONFIG_BEGIN",
        "CONFIG_DEVICE_BLOCK",
        "CONFIG_PORT_BLOCK",
        "CONFIG_COMMIT"
      ],
      "notes": "同一 application/version/content/mcuPayload 摘要组成 BEGIN、DEVICE、按 portNo 连续有序的 PORT、COMMIT；partCount=expectedPortCount+3，partIndex 与端口严格对应。PORT 的 partIndex=portNo+2 且严格小于 partCount，不占用最后 COMMIT 的序号；COMMIT 的 partIndex 等于 partCount。集合按投口号计算总摘要，未收齐或总摘要不符不改变现用配置。实际会话先缓存本次命令接受/拒绝，只有 execute_once 才改变配置；重复/旧命令不重复切换。进行中的业务、待保存结果及所有者其他占用/安全/升级条件阻止配置，配置暂存也阻止新业务。明确接受不同应用编号的新 BEGIN 可替换仅暂存的候选，不清业务、结果或现用配置；拒绝版本回退、同版本不同摘要和同应用编号改用另一版本。相同版本/摘要的新应用可重新完整提交。配置只在 MCU RAM 保留，Pi 重连不清理，MCU 重启不自动重放。RAM 整套切换与整机应用须区分，所有实际消费者未接通前不得发送 APPLIED 或伪造设备已应用事实。"
    },
