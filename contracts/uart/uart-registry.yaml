  "semanticRules": [
    {
      "id": "DEVICE_ENTRY_URL_APPLICATION",
      "kind": "DEVICE_ENTRY_URL_APPLICATION",
      "messages": ["DEVICE_ENTRY_URL_BEGIN", "DEVICE_ENTRY_URL_PART", "DEVICE_ENTRY_URL_COMMIT", "DEVICE_ENTRY_URL_APPLY_RESULT", "QUERY_COMMAND"],
      "notes": "URL原字节必须为1至192字节、以https://开头，并限制为0x21..0x7e且排除双引号和反斜杠，空格等字符使用百分号编码。BEGIN/COMMIT的partCount等于ceil(urlLength/64)，PART为1基连续分片且同一应用身份/摘要/总数完全一致。只有空闲时COMMIT；完整原子入队即回APPLIED，空间不足零字节生效并回FAILED/BUSY，不再追踪USART发送完成。MCU只在RAM保存当前URL、staging和最近应用结果；Pi可靠保存匹配原字节后才完成后台命令。Pi丢结果或重启只用QUERY_COMMAND查询原COMMIT，MCU可重发匹配的RAM结果但不得再次写屏；MCU启动号变化或UART重连由Pi以新应用身份重新应用。"
    },
    {
      "id": "PROCESS_EVENT_CUSTODY", "kind": "RESULT_HANDOFF",
      "messages": ["QUERY_PROCESS_EVENT", "PROCESS_EVENT_QUERY_REPLY", "PROCESS_EVENT_SAVED", "PROCESS_EVENT_SAVED_REPLY"],
      "notes": "只读查询绑定已受理原命令及业务/投口/测量类型/步骤/配置，不消费机械命令序号。MCU前台有界保留原字节，HELD返回原事件，不重新测量；同业务同类型同一步骤而原身份冲突返回IDENTITY_CONFLICT。Pi原文和原业务关系同一SQLite事务提交后才可发送精确保存确认。普通ACK不释放过程记录；保存身份匹配启动/事件序号/消息类型/全原文摘要才释放，仅数据槽释放，不改业务阶段、最终结果或准入。保存回复无queryId，不证明新鲜状态；需新查询观察。已释放引用可能被后一步骤替换，NOT_FOUND不是未执行或空闲证明。跨阶段顺序与全局事件编号由业务所有者负责，尚未接完整业务执行器。"
    },
    {
      "id": "NATIVE_PROCESS_MEASUREMENT", "kind": "MEASUREMENT_VALIDITY",
      "messages": ["WORK_PREOPEN_WEIGHT_READY", "WORK_POSTCLOSE_WEIGHT_READY", "WORK_PREUNLOCK_WEIGHT_READY", "CLEAN_FINAL_WEIGHT_READY", "FULLNESS_SAMPLE_RESULT", "BASELINE_MEASUREMENT_RESULT"],
      "notes": "过程消息与WORK_RESULT使用同一ResultMeasurementKind。消息描述本启动下实际发生的一次终态测量，测量UUID、启动号、事件序号及所用配置版本非零，elapsed<=uptime且最多5000ms、最多32点。STABLE_MEAN/TIMEOUT_MEDIAN为可用值，至少5点且fault=NONE；均值跨度<=100g，中位数恰在5000ms形成，不转旧UNSTABLE或末四点均值。失败种类4..10必须将重量槽清零，kind而非数字0表示无可用重量；样本数/跨度保留实际诊断，不凭空补造。INTERRUPTED与MEASUREMENT_INTERRUPTED原因码必须成对出现，保留实际测量身份/已采样数/中断时耗时，不能冒充称重超时或未采集；携带中断测量的WORK_RESULT只允许FAILED/CANCELLED。业务中断原因不是称重硬件故障，不扩大FAULT_OBSERVED硬件故障范围。NOT_TAKEN/MCU_RESET_LOST仅可用于最终结果缺失槽，不能冒充本次MCU实际测量事件。其他失败的故障细码是附加诊断，没有具体诊断时可为NONE，不覆盖失败kind。configVersion是测量采用的版本，不是收包时新版本。前四种measurementUid及BASELINE的weightMeasurementUid标识实际测量；BASELINE的measurementUid仍标识原测量任务。称重只是满溢消息的一个分量，不证明距离传感器或完整业务准入。Pi须完整保存原字节并检查原业务/代次/冲突再确认，校验成功或收到ACK不等于新机械授权、清占用、上云或产生资金。过程保留/精确确认已有独立候选与实际控制入口；完整业务接线仍待实现。"
    },
    {
      "id": "DEVICE_FACTS_SCOPE_AND_CAPTURE", "kind": "WORK_SCOPE", "messages": ["QUERY_DEVICE_FACTS", "DEVICE_FACTS_REPLY"],
      "notes": "单投口只读查询，完整回显queryId/targetMcuBootId/portNo。BOOT_MISMATCH当且仅当当前启动不同于目标启动；非AVAILABLE正文事实全部清零，不能解释为门关闭或重量为零。AVAILABLE表示抓取时该MCU已知的事实集合，不表示所有传感器同一瞬间采样。controlUptimeMs不晚于capturedUptimeMs；门目标、输出、防夹输入必须来自同一次控制刷新。输出指最近施加给GPIO的命令，不是独立电气回读或物理门位。烟感与满溢原始观察各带采集时间，缺来源保持NOT_OBSERVED，查询不能刷新旧读数。查询不能驱动、清占用、确认结果或决定接单，不能代替完整健康/业务核对及尚未迁移的多投口快照。"
    },
    {
      "id": "DEVICE_FACTS_DOOR_OUTPUTS", "kind": "WORK_SCOPE", "messages": ["DEVICE_FACTS_REPLY"],
