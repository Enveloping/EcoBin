  "nonVolatileRequirements": [
    "MCU 每次真实重启必须改变非零 mcuBootId，并优先使用持久单调启动计数器。",
    "所有关键 MCU 事件在香橙派 SQLite 持久 ACK 前必须保留原 mcuBootId、mcuEventSequence 和原始内容。",
    "不可逆开门或电磁阀通电命令的 mcuCommandUid、摘要和既有处置必须跨看门狗/掉电保留，避免重放再次驱动。",
    "已应用配置版本、完整摘要、MCU 子集摘要及非活动 staging 进度必须跨重启保存。",
    "当前作业、投递门安全阶段和清运电磁阀可能通电边界必须具有掉电后可恢复证据。",
    "START_DELIVERY_SESSION 与首次开门授权必须分离；MCU 在收到 AUTHORIZE_DELIVERY_FIRST_OPEN 前不得首次开门。",
    "清运 cleanActionSequence、与其绑定的最终称重以及后续再次解锁造成的作废边界必须可恢复。",
    "正式 Registry 不定义清运门门磁、清运门自动关门或清运门 SAFE_CLOSE 能力。"
  ]
