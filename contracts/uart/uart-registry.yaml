        "STATE_SNAPSHOT_END"
      ],
      "notes": "同一 snapshotUid 恰有 BEGIN、portCount 个连续有序 PORT 与 END；partCount=portCount+2；仅完整集合且 snapshotSha256 一致可用于当前连接恢复。appliedConfigVersion=0 当且仅当两个 applied SHA 全零；大于 0 时二者均非零。stagingValid=false 时全部 staging 字段全零；为 true 时 applicationUid/SHA 非零、configVersion>=1、stagingPartCount=portCount+3 且为 4..9，bitmap 的 bit n 对应 partIndex=n+1、bit0=1、超出 stagingPartCount 的位为 0。首版不宣称这些状态跨掉电保留。"
