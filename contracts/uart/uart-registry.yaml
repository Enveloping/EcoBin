        { "name": "stagingConfigVersion", "type": "u64", "maximum": 9007199254740991, "invalidWhen": "stagingValid=false", "invalidEncoding": "all-zero bytes", "notes": "stagingValid=true 时范围为 1..9007199254740991" },
