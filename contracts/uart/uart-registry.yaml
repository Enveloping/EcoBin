    "首版不要求 MCU 对命令去重、关键事件、配置、作业状态或 mcuBootId 做掉电持久化；对应持久化能力位是可选后续能力，未实现时不得宣称支持。",
    "MCU 每次重启先令 PB6/PB7/PB8 回到安全输出，进入 BOOT_RECOVERY；投递门物理状态始终 NOT_OBSERVABLE。",
    "香橙派必须在 HELLO、QUERY_STATE 和配置重同步后显式发送 CONFIRM_NO_ACTIVE_WORK 或 RESUME_CLEAN_OPERATION；结果事件获 ACK 后 MCU 才离开 BOOT_RECOVERY。",
    "重启打断的投递不恢复，香橙派将进行中订单标记为硬件异常并交由人工审核；本 Registry 不定义前后端修复流程。",
    "重启打断的清运只能用原 operationUid、递增 recoveryGeneration 和 nextCleanActionSequence 续接；恢复不得重启操作窗口。",
    "当前上电周期内关键 MCU 事件在香橙派 SQLite ACK 前保留相同 mcuBootId、mcuEventSequence 和内容；掉电后允许丢失。",
    "START_DELIVERY_SESSION 与首次开门授权保持分离；AUTHORIZE_DELIVERY_FIRST_OPEN 只允许调度开门信号，不证明物理门位。",
    "清运锁断电不推导清运门关闭；清运完成只认清运员在屏幕上的明确人工确认。",
    "targetMcuBootId、跨重启 exactly-once 和持久事件队列属于后续升级，不在首版契约内。"
  ]
