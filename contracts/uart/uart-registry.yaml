      "notes": "WORK_RESULT固定199字节/213字节总帧，完整摘要覆盖身份与全部正文；只有全部校验及真实SQLite提交成功才可RESULT_SAVED，半帧/CRC/摘要/语义失败不得确认。完整结果与PENDING_CLASSIFICATION待上报任务同事务提交；该任务须经Pi结合照片、上下文和异常记录裁定后才能生成OneNet事件，不直接进入余额/提现链。相同启动+结果号正文冲突保留原结果及冲突证据，不覆盖、不确认冲突正文。查询精确身份只读，HELD时重发原字节；BOOT_MISMATCH当且仅当当前启动不等于结果启动；保存/释放不改变Pi或云端业务占用。仅投递/清运适用；originCommand是本启动的START或RESUME，不伪造重启前命令。照片、袋子身份/代次、价格和用户归属仍由Pi持久上下文提供。"
