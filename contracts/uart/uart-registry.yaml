      "notes": "仅DELIVERY_SESSION/CLEAN_OPERATION。所有回复完整回显queryId+原命令身份+workUid/type/port，不反推受理或动作结果。BOOT_MISMATCH当且仅当currentBoot不同于targetBoot；RUNNING只用本业务类型阶段或SAFETY_LOCKED，结果号/摘要槽为零。RESULT_HELD/RESULT_RELEASED阶段固定为对应FINALIZING，结果号非零，摘要引用原冻结结果。NOT_FOUND/IDENTITY_CONFLICT/BOOT_MISMATCH的phase为IDLE空编码且结果号/摘要全零，不提供当前全机空闲证明。当前未保留详情并不等于从未执行；查询、超时、NOT_FOUND、结果释放都不释放Pi业务占用，也不授权重发机械命令。只保留最近一笔业务身份，新的业务覆盖旧查询详情必须在旧结果已交接后；MCU重启清RAM但Pi保留原业务。"
