            "enum": [
              "miniapp",
              "miniapp-staff"
            ]
          },
          "entryMode": {
            "type": "string",
            "enum": [
              "USER",
              "CLEANING",
              "MANAGEMENT"
            ]
          },
          "expiresAt": {
            "$ref": "#/components/schemas/UtcTimestamp"
          },
          "organization": {
            "$ref": "#/components/schemas/OrganizationSummary"
          },
          "subjectUid": {
            "$ref": "#/components/schemas/PublicUid"
          },
          "displayName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "capabilities": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[a-z][a-z0-9-]*\\.[a-z][a-z0-9-]*$"
            }
          },
          "phoneBound": {
            "type": "boolean"
          }
        }
      },
      "MiniappSessionCreatedEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "data",
          "requestId"
        ],
        "properties": {
          "code": {
            "type": "string",
            "const": "OK"
          },
