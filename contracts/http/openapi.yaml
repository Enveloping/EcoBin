      },
      "wechatPaySignature": {
        "type": "apiKey",
        "in": "header",
        "name": "Wechatpay-Signature"
      },
      "wechatPayTimestamp": {
        "type": "apiKey",
        "in": "header",
        "name": "Wechatpay-Timestamp"
      },
      "wechatPayNonce": {
        "type": "apiKey",
        "in": "header",
        "name": "Wechatpay-Nonce"
      },
