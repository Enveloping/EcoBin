          },
          "400": {
            "$ref": "#/components/responses/InvalidRequest"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedProblem"
          },
          "403": {
            "$ref": "#/components/responses/ForbiddenProblem"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          }
        }
      }
    },
    "/api/v1/web/auth/sessions/current": {
      "get": {
        "operationId": "getCurrentWebSession",
        "tags": [
          "Web authentication"
        ],
        "summary": "Read the current tenant or staff Web session",
        "security": [
          {
            "webSessionCookie": []
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/WebSessionCurrent"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedProblem"
