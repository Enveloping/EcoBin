      "WechatPayEncryptedNotification": {
        "type": "object",
        "additionalProperties": true,
        "required": [
          "id",
          "create_time",
          "event_type",
          "resource_type",
          "resource"
        ],
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "create_time": {
            "type": "string",
            "format": "date-time"
          },
          "event_type": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "resource_type": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "resource": {
            "type": "object",
            "additionalProperties": true,
            "required": [
              "algorithm",
              "ciphertext",
              "nonce"
            ],
            "properties": {
              "algorithm": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64
              },
              "ciphertext": {
                "type": "string",
                "minLength": 1
              },
              "associated_data": {
                "type": "string"
              },
              "nonce": {
                "type": "string",
                "minLength": 1
              }
            }
          }
        }
      }
    }
