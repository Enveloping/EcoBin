{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "EcoBin P0 HTTP API",
    "version": "1.0.0-rc.1",
    "description": "EcoBin /api/v1 transport contract. Business slices add their own paths and schemas without redefining these cross-cutting rules."
  },
  "servers": [
    {
      "url": "/",
      "description": "Same-origin deployment"
    }
  ],
  "x-ecobin-legacy-credential-cutover": {
    "webLocalStorageKeysToDelete": [
      "ecobin-auth"
    ],
    "miniappStorageKeysToDelete": [
      "ecobin_token",
      "ecobin_role",
      "ecobin_user_info"
    ],
    "serverLegacyBearerPolicy": "Before production cutover, disable legacy login issuance and rotate the legacy JWT verification secret on every instance without retaining the prior verification key. Target sessions then rely on persisted jti and authVersion revocation."
  },
  "tags": [
    {
      "name": "Web authentication",
      "description": "Cookie-backed Web sessions and anonymous CSRF bootstrap."
    },
    {
      "name": "Miniapp authentication",
      "description": "Single-audience Bearer sessions created from one-time wx.login codes."
    },
    {
      "name": "Signed external notifications",
      "description": "Exact WeChat Pay notification paths authenticated by the four APIv3 signature headers."
    }
  ],
  "paths": {
    "/api/v1/web/auth/csrf-token": {
      "get": {
        "operationId": "getWebCsrfToken",
        "tags": [
          "Web authentication"
        ],
        "summary": "Bootstrap or rotate the SPA CSRF token",
        "security": [],
        "responses": {
          "200": {
            "description": "CSRF token returned; the response is never cacheable",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              },
              "X-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CsrfTokenEnvelope"
                }
              }
            }
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          },
          "500": {
            "$ref": "#/components/responses/InternalProblem"
          }
        }
      }
    },
    "/api/v1/web/auth/sessions": {
      "post": {
        "operationId": "createWebSession",
        "tags": [
          "Web authentication"
        ],
        "summary": "Create a tenant or staff Web session",
        "security": [
          {
            "webCsrfToken": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WebLoginRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "$ref": "#/components/responses/WebSessionCreated"
          },
          "400": {
            "$ref": "#/components/responses/InvalidRequest"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedProblem"
          },
          "403": {
            "$ref": "#/components/responses/ForbiddenProblem"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          }
        }
      }
    },
    "/api/v1/web/platform/auth/sessions": {
      "post": {
        "operationId": "createPlatformWebSession",
        "tags": [
          "Web authentication"
        ],
        "summary": "Create a platform administrator Web session",
        "security": [
          {
            "webCsrfToken": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WebLoginRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "$ref": "#/components/responses/WebSessionCreated"
          },
          "400": {
            "$ref": "#/components/responses/InvalidRequest"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedProblem"
          },
          "403": {
            "$ref": "#/components/responses/ForbiddenProblem"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          }
        }
      }
    },
    "/api/v1/web/auth/sessions/current": {
      "get": {
        "operationId": "getCurrentWebSession",
        "tags": [
          "Web authentication"
        ],
        "summary": "Read the current tenant or staff Web session",
        "security": [
          {
            "webSessionCookie": []
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/WebSessionCurrent"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedProblem"
          }
        }
      },
      "delete": {
        "operationId": "deleteCurrentWebSession",
        "tags": [
          "Web authentication"
        ],
        "summary": "Revoke the current tenant or staff Web session",
        "security": [
          {
            "webSessionCookie": [],
            "webCsrfToken": []
          }
        ],
        "responses": {
          "204": {
            "$ref": "#/components/responses/NoContent"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedProblem"
          },
          "403": {
            "$ref": "#/components/responses/CsrfProblem"
          }
        }
      }
    },
    "/api/v1/web/platform/auth/sessions/current": {
      "get": {
        "operationId": "getCurrentPlatformWebSession",
        "tags": [
          "Web authentication"
        ],
        "summary": "Read the current platform Web session",
        "security": [
          {
            "webSessionCookie": []
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/WebSessionCurrent"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedProblem"
          }
        }
      },
      "delete": {
        "operationId": "deleteCurrentPlatformWebSession",
        "tags": [
          "Web authentication"
        ],
        "summary": "Revoke the current platform Web session",
        "security": [
          {
            "webSessionCookie": [],
            "webCsrfToken": []
          }
        ],
        "responses": {
          "204": {
            "$ref": "#/components/responses/NoContent"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedProblem"
          },
          "403": {
            "$ref": "#/components/responses/CsrfProblem"
          }
        }
      }
    },
    "/api/v1/miniapp/auth/sessions": {
      "post": {
        "operationId": "createMiniappSession",
        "tags": [
          "Miniapp authentication"
        ],
        "summary": "Exchange one wx.login code for exactly one audience session",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MiniappLoginRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "$ref": "#/components/responses/MiniappSessionCreated"
          },
          "400": {
            "$ref": "#/components/responses/InvalidRequest"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedProblem"
          },
          "403": {
            "$ref": "#/components/responses/ForbiddenProblem"
          },
          "422": {
            "$ref": "#/components/responses/BusinessRuleProblem"
          },
          "503": {
            "$ref": "#/components/responses/DependencyUnavailable"
          }
        }
      }
    },
    "/api/v1/miniapp/auth/sessions/current": {
      "get": {
        "operationId": "getCurrentMiniappSession",
        "tags": [
          "Miniapp authentication"
        ],
        "summary": "Read the current ordinary or cleaning miniapp session",
        "security": [
          {
            "miniappBearer": []
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/MiniappSessionCurrent"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedProblem"
          }
        }
      },
      "delete": {
        "operationId": "deleteCurrentMiniappSession",
        "tags": [
          "Miniapp authentication"
        ],
        "summary": "Revoke the current ordinary or cleaning miniapp session",
        "security": [
          {
            "miniappBearer": []
          }
        ],
        "responses": {
          "204": {
            "$ref": "#/components/responses/NoContent"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedProblem"
          }
        }
      }
    },
    "/api/v1/miniapp-staff/auth/sessions/current": {
      "get": {
        "operationId": "getCurrentMiniappStaffSession",
        "tags": [
          "Miniapp authentication"
        ],
        "summary": "Read the current staff miniapp session",
        "security": [
          {
            "miniappBearer": []
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/MiniappSessionCurrent"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedProblem"
          }
        }
      },
      "delete": {
        "operationId": "deleteCurrentMiniappStaffSession",
        "tags": [
          "Miniapp authentication"
        ],
        "summary": "Revoke the current staff miniapp session",
        "security": [
          {
            "miniappBearer": []
          }
        ],
        "responses": {
          "204": {
            "$ref": "#/components/responses/NoContent"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedProblem"
          }
        }
      }
    },
    "/api/v1/wechat-pay/notifications/native-payments": {
      "post": {
        "operationId": "receiveWechatNativePaymentNotification",
        "tags": [
          "Signed external notifications"
        ],
        "summary": "Reliably receive a signed and encrypted Native payment notification",
        "security": [
          {
            "wechatPaySignature": [],
            "wechatPayTimestamp": [],
            "wechatPayNonce": [],
            "wechatPaySerial": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WechatPayEncryptedNotification"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The authenticated notification and its processing task are durably recorded; no domain completion is implied"
          },
          "400": {
            "description": "The signature, encryption envelope, or existing channel order identity is invalid"
          },
          "500": {
            "description": "Reliable receipt failed; the sender must retry"
          }
        }
      }
    },
    "/api/v1/wechat-pay/notifications/merchant-transfers": {
      "post": {
        "operationId": "receiveWechatMerchantTransferNotification",
        "tags": [
          "Signed external notifications"
        ],
        "summary": "Reliably receive a signed and encrypted merchant transfer notification",
        "security": [
          {
            "wechatPaySignature": [],
            "wechatPayTimestamp": [],
            "wechatPayNonce": [],
            "wechatPaySerial": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WechatPayEncryptedNotification"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The authenticated notification and its processing task are durably recorded; no domain completion is implied"
          },
          "400": {
            "description": "The signature, encryption envelope, or existing channel order identity is invalid"
          },
          "500": {
            "description": "Reliable receipt failed; the sender must retry"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "webSessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-ecobin-web-session",
        "description": "Secure, HttpOnly, SameSite=Lax, Path=/ and no Domain. JavaScript never reads this value."
      },
      "webCsrfToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-TOKEN",
        "description": "Bootstrapped from GET /api/v1/web/auth/csrf-token and rotated after login/logout."
      },
      "miniappBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Exactly one short-lived aud=miniapp or aud=miniapp-staff session. No refresh token."
      },
      "wechatPaySignature": {
        "type": "apiKey",
        "in": "header",
        "name": "Wechatpay-Signature"
      },
      "wechatPayTimestamp": {
        "type": "apiKey",
        "in": "header",
        "name": "Wechatpay-Timestamp"
      },
      "wechatPayNonce": {
        "type": "apiKey",
        "in": "header",
        "name": "Wechatpay-Nonce"
      },
      "wechatPaySerial": {
        "type": "apiKey",
        "in": "header",
        "name": "Wechatpay-Serial"
      }
    },
    "parameters": {
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "UUIDv4 generated once for one human intent and reused by every retry of that same intent.",
        "schema": {
          "$ref": "#/components/schemas/UuidV4"
        }
      },
      "Page": {
        "name": "page",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "default": 1
        }
      },
      "PageSize": {
        "name": "pageSize",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 200,
          "default": 20
        }
      },
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "schema": {
          "$ref": "#/components/schemas/Cursor"
        }
      }
    },
    "headers": {
      "NoStore": {
        "description": "Sensitive or mutable projections are not cacheable",
        "schema": {
          "type": "string",
          "const": "no-store"
        }
      },
      "RequestId": {
        "description": "Transport request identifier; never a business idempotency identity",
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        }
      },
      "CorrelationId": {
        "description": "Optional distributed trace correlation identifier",
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        }
      },
      "Location": {
        "description": "Same-origin authoritative status resource",
        "schema": {
          "$ref": "#/components/schemas/StatusUrl"
        }
      },
      "RetryAfter": {
        "description": "Whole seconds before the client should retry",
        "schema": {
          "type": "integer",
          "minimum": 1
        }
      }
    },
    "responses": {
      "WebSessionCreated": {
        "description": "A new server-side Web session was created and the HttpOnly cookie was set",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/NoStore"
          },
          "X-Request-Id": {
            "$ref": "#/components/headers/RequestId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/WebSessionEnvelope"
            }
          }
        }
      },
      "WebSessionCurrent": {
        "description": "Current Web session and live capability projection",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/NoStore"
          },
          "X-Request-Id": {
            "$ref": "#/components/headers/RequestId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/WebSessionEnvelope"
            }
          }
        }
      },
      "MiniappSessionCreated": {
        "description": "Exactly one short-lived miniapp audience session was created",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/NoStore"
          },
          "X-Request-Id": {
            "$ref": "#/components/headers/RequestId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/MiniappSessionCreatedEnvelope"
            }
          }
        }
      },
      "MiniappSessionCurrent": {
        "description": "Current miniapp session safety projection",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/NoStore"
          },
          "X-Request-Id": {
            "$ref": "#/components/headers/RequestId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/MiniappSessionViewEnvelope"
            }
          }
        }
      },
      "AcceptedOperation": {
        "description": "The intent is durably accepted but the business result is not terminal",
        "headers": {
          "Location": {
            "$ref": "#/components/headers/Location"
          },
          "Cache-Control": {
            "$ref": "#/components/headers/NoStore"
          },
          "X-Request-Id": {
            "$ref": "#/components/headers/RequestId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/AcceptedOperationEnvelope"
            }
          }
        }
      },
      "NoContent": {
        "description": "The synchronous local transition completed and there is no response body",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/NoStore"
          },
          "X-Request-Id": {
            "$ref": "#/components/headers/RequestId"
          }
        }
      },
      "InvalidRequest": {
        "description": "Malformed JSON, type, format, or cross-field input",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      },
      "UnauthorizedProblem": {
        "description": "Authentication is missing, invalid, revoked, expired, or has the wrong audience",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/NoStore"
          }
        },
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      },
      "ForbiddenProblem": {
        "description": "The visible resource exists but the authenticated subject lacks the current capability",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      },
      "CsrfProblem": {
        "description": "The Web CSRF token is missing, stale, or invalid",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            },
            "example": {
              "code": "SECURITY.CSRF_INVALID",
              "message": "请求安全令牌已失效",
              "requestId": "01J3EXAMPLE00000000000001",
              "retryable": true,
              "details": {}
            }
          }
        }
      },
      "ConflictProblem": {
        "description": "Idempotency digest, expected version, state, or occupancy conflict",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      },
      "BusinessRuleProblem": {
        "description": "The input is valid but a current business qualification or invariant rejects it",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      },
      "TooManyRequests": {
        "description": "The caller exceeded an entry-specific rate limit",
        "headers": {
          "Retry-After": {
            "$ref": "#/components/headers/RetryAfter"
          }
        },
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      },
      "DependencyUnavailable": {
        "description": "A temporary dependency is unavailable or safe internal retries were exhausted",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      },
      "InternalProblem": {
        "description": "Unexpected internal failure",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      }
    },
    "schemas": {
      "UuidV4": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
        "example": "4b9e8c22-7d38-4e4b-a1b0-7a0e1656e001"
      },
      "PublicUid": {
        "allOf": [
          {
            "$ref": "#/components/schemas/UuidV4"
          }
        ],
        "description": "Stable public identity; never an internal BIGINT primary key"
      },
      "BusinessNumber": {
        "type": "string",
        "minLength": 1,
        "maxLength": 64,
        "pattern": "^[A-Z0-9][A-Z0-9-]*$",
        "example": "WD-20260726-000001"
      },
      "MoneyCny": {
        "type": "string",
        "pattern": "^-?(0|[1-9][0-9]*)\\.[0-9]{2}$",
        "description": "Exact CNY yuan string. Never decode to an IEEE-754 number.",
        "example": "12.30"
      },
      "PositiveMoneyCny": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]*)\\.[0-9]{2}$",
        "description": "Non-negative exact CNY yuan string",
        "example": "50.00"
      },
      "UnitPriceCnyPerKg": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]*)\\.[0-9]{4}$",
        "description": "Exact CNY/kg string",
        "example": "0.8000"
      },
      "BusinessWeightKg": {
        "type": "string",
        "pattern": "^-?(0|[1-9][0-9]*)\\.[0-9]{2}$",
        "description": "Exact business weight in kilograms",
        "example": "1.25"
      },
      "RawWeightGrams": {
        "type": "integer",
        "format": "int64",
        "minimum": -2147483648,
        "maximum": 2147483647,
        "description": "Signed raw sensor weight in grams",
        "example": -125
      },
      "UtcTimestamp": {
        "type": "string",
        "format": "date-time",
        "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$",
        "example": "2026-07-26T03:15:20.123Z"
      },
      "Cursor": {
        "type": "string",
        "minLength": 1,
        "maxLength": 512,
        "description": "Opaque stable cursor; clients must not parse or construct it",
        "example": "eyJ2IjoxLCJ3YXRlcm1hcmsiOiIwMTkwIn0"
      },
      "ExpectedVersion": {
        "type": "integer",
        "minimum": 0,
        "description": "Last server version explicitly observed by the operator",
        "example": 3
      },
      "StatusUrl": {
        "type": "string",
        "pattern": "^/api/v1/(web|miniapp|miniapp-staff)/[A-Za-z0-9_~!$&'()*+,;=:@%./?{}-]+$",
        "description": "Same-origin authoritative status path",
        "example": "/api/v1/web/withdrawals/WD-20260726-000001"
      },
      "ProblemDetail": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message",
          "requestId",
          "retryable",
          "details"
        ],
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[A-Z][A-Z0-9_]*(\\.[A-Z][A-Z0-9_]*)+$",
            "example": "COMMON.IDEMPOTENCY_KEY_CONFLICT"
          },
          "message": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500,
            "example": "相同操作标识已绑定到不同请求"
          },
