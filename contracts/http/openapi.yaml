{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "EcoBin P0 HTTP API",
    "version": "1.0.0-rc.1",
    "description": "EcoBin /api/v1 transport contract. Business slices add their own paths and schemas without redefining these cross-cutting rules."
  },
  "servers": [
    {
      "url": "/",
      "description": "Same-origin deployment"
    }
  ],
  "x-ecobin-legacy-credential-cutover": {
    "webLocalStorageKeysToDelete": [
      "ecobin-auth"
    ],
    "miniappStorageKeysToDelete": [
      "ecobin_token",
      "ecobin_role",
      "ecobin_user_info"
    ],
    "serverLegacyBearerPolicy": "Before production cutover, disable legacy login issuance and rotate the legacy JWT verification secret on every instance without retaining the prior verification key. Target sessions then rely on persisted jti and authVersion revocation."
  },
  "tags": [
    {
      "name": "Web authentication",
      "description": "Cookie-backed Web sessions and anonymous CSRF bootstrap."
    },
    {
      "name": "Identity directory",
      "description": "V-01 tenant, organization, staff, membership and authorization management. Scope is always derived from the persisted Web session."
    },
    {
      "name": "Miniapp authentication",
      "description": "Single-audience Bearer sessions created from one-time wx.login codes."
    },
    {
      "name": "Miniapp delivery",
      "description": "Ordinary-user delivery discovery, phone-bound start authorization, owned-session polling and owned order history."
    },
    {
      "name": "Miniapp wallet",
      "description": "Ordinary-user read-only wallet summary."
    },
    {
      "name": "Device management",
      "description": "Platform asset inventory plus tenant-scoped deployment, runtime and immutable configuration management."
    },
    {
      "name": "Delivery orders",
      "description": "Tenant-scoped delivery evidence, cursor queries, additive review revisions and wallet deltas."
    },
    {
      "name": "Delivery configuration",
      "description": "Organization-scoped immutable delivery and review rules. M0 keeps the review mode fixed to all-manual."
    },
    {
      "name": "Wallet",
      "description": "Ordinary-user wallet summaries plus personal and organization-scoped immutable ledger queries."
    },
    {
      "name": "Signed external notifications",
      "description": "Exact WeChat Pay notification paths authenticated by the four APIv3 signature headers."
    }
  ],
  "paths": {
    "/api/v1/web/auth/csrf-token": {
      "get": {
        "operationId": "getWebCsrfToken",
        "tags": [
          "Web authentication"
        ],
        "summary": "Bootstrap or rotate the SPA CSRF token",
        "security": [],
        "responses": {
          "200": {
            "description": "CSRF token returned; the response is never cacheable",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              },
              "X-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CsrfTokenEnvelope"
                }
              }
            }
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          },
          "500": {
            "$ref": "#/components/responses/InternalProblem"
          }
        }
      }
    },
    "/api/v1/web/auth/sessions": {
      "post": {
        "operationId": "createWebSession",
        "tags": [
          "Web authentication"
        ],
        "summary": "Create a tenant or staff Web session",
        "security": [
          {
            "webCsrfToken": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WebLoginRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "$ref": "#/components/responses/WebSessionCreated"
          },
          "400": {
            "$ref": "#/components/responses/InvalidRequest"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedProblem"
          },
          "403": {
            "$ref": "#/components/responses/ForbiddenProblem"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          }
        }
      }
    },
    "/api/v1/web/platform/auth/sessions": {
      "post": {
