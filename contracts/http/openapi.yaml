          "fullnessRecheckDelayMs": {"type": "integer", "minimum": 0},
          "doorAutoCloseTimeoutMs": {"type": "integer", "minimum": 1000},
          "fullnessSensorKind": {
            "type": ["string", "null"],
            "enum": ["ULTRASONIC", "DIGITAL_INFRARED", null]
