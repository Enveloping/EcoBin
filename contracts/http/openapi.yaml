          "requestId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "example": "01J3EXAMPLE00000000000001"
          },
          "retryable": {
            "type": "boolean",
            "example": false
          },
          "details": {
            "type": "object",
            "additionalProperties": true,
            "example": {}
          }
        }
