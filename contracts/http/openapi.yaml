  "x-ecobin-client-foundation": {
    "webCredentials": "include",
    "webSessionStorage": "HttpOnly cookie only",
    "csrfHeader": "X-CSRF-TOKEN",
    "idempotencyHeader": "Idempotency-Key",
    "asyncResponse": "#/components/responses/AcceptedOperation",
