            "type": "object",
            "properties": {
              "reason": {
                "type": "string",
                "maxLength": 500
              }
            }
          }
        ]
      },
      "UuidV4": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
        "example": "4b9e8c22-7d38-4e4b-a1b0-7a0e1656e001"
      },
      "PublicUid": {
        "allOf": [
          {
            "$ref": "#/components/schemas/UuidV4"
          }
        ],
        "description": "Stable public identity; never an internal BIGINT primary key"
      },
      "BusinessNumber": {
        "type": "string",
        "minLength": 1,
        "maxLength": 64,
        "pattern": "^[A-Z0-9][A-Z0-9-]*$",
        "example": "WD-20260726-000001"
      },
      "MoneyCny": {
        "type": "string",
        "pattern": "^-?(0|[1-9][0-9]*)\\.[0-9]{2}$",
        "description": "Exact CNY yuan string. Never decode to an IEEE-754 number.",
        "example": "12.30"
      },
      "PositiveMoneyCny": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]*)\\.[0-9]{2}$",
        "description": "Non-negative exact CNY yuan string",
        "example": "50.00"
      },
      "UnitPriceCnyPerKg": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]*)\\.[0-9]{4}$",
        "description": "Exact CNY/kg string",
        "example": "0.8000"
      },
      "BusinessWeightKg": {
        "type": "string",
        "pattern": "^-?(0|[1-9][0-9]*)\\.[0-9]{2}$",
        "description": "Exact business weight in kilograms",
        "example": "1.25"
      },
      "RawWeightGrams": {
        "type": "integer",
        "format": "int64",
        "minimum": -2147483648,
        "maximum": 2147483647,
        "description": "Signed raw sensor weight in grams",
        "example": -125
      },
      "UtcTimestamp": {
        "type": "string",
        "format": "date-time",
        "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$",
        "example": "2026-07-26T03:15:20.123Z"
      },
      "Cursor": {
        "type": "string",
        "minLength": 1,
        "maxLength": 512,
        "description": "Opaque stable cursor; clients must not parse or construct it",
        "example": "eyJ2IjoxLCJ3YXRlcm1hcmsiOiIwMTkwIn0"
      },
      "ExpectedVersion": {
        "type": "integer",
        "minimum": 0,
        "description": "Last server version explicitly observed by the operator",
        "example": 3
      },
      "StatusUrl": {
        "type": "string",
        "pattern": "^/api/v1/(web|miniapp|miniapp-staff)/[A-Za-z0-9_~!$&'()*+,;=:@%./?{}-]+$",
        "description": "Same-origin authoritative status path",
        "example": "/api/v1/web/withdrawals/WD-20260726-000001"
      },
      "ProblemDetail": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message",
          "requestId",
          "retryable",
          "details"
        ],
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[A-Z][A-Z0-9_]*(\\.[A-Z][A-Z0-9_]*)+$",
            "example": "COMMON.IDEMPOTENCY_KEY_CONFLICT"
          },
          "message": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500,
            "example": "相同操作标识已绑定到不同请求"
          },
          "requestId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "example": "01J3EXAMPLE00000000000001"
          },
          "retryable": {
            "type": "boolean",
            "example": false
          },
          "details": {
            "type": "object",
            "additionalProperties": true,
            "example": {}
          }
        }
      },
      "AcceptedOperation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "operationId",
          "resourceId",
          "status",
          "statusUrl",
          "recommendedPollAfterMs"
        ],
        "properties": {
          "operationId": {
            "$ref": "#/components/schemas/UuidV4"
          },
          "resourceId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "example": "WD-20260726-000001"
          },
          "status": {
            "type": "string",
            "enum": [
              "ACCEPTED",
              "PROCESSING",
              "UNKNOWN"
            ],
            "example": "PROCESSING"
          },
          "statusUrl": {
            "$ref": "#/components/schemas/StatusUrl"
          },
          "recommendedPollAfterMs": {
            "type": "integer",
            "minimum": 250,
            "maximum": 60000,
            "example": 1500
          }
        }
      },
      "AcceptedOperationEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "data",
          "requestId"
        ],
        "properties": {
          "code": {
            "type": "string",
            "const": "OK"
          },
          "data": {
            "$ref": "#/components/schemas/AcceptedOperation"
          },
          "requestId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        }
      },
      "PageData": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "page",
          "pageSize",
          "total"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {}
          },
          "page": {
            "type": "integer",
            "minimum": 1
          },
          "pageSize": {
            "type": "integer",
            "minimum": 1,
            "maximum": 200
          },
          "total": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "CursorPageData": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "nextCursor",
          "asOf"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {}
          },
          "nextCursor": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/Cursor"
              },
              {
                "type": "null"
              }
            ]
          },
          "asOf": {
            "$ref": "#/components/schemas/UtcTimestamp"
          }
        }
      },
      "CsrfToken": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "token",
          "headerName"
        ],
        "properties": {
          "token": {
            "type": "string",
            "minLength": 32,
            "maxLength": 512,
            "description": "Opaque token kept in JavaScript memory only",
            "example": "csrf-example-value-not-a-production-secret-0001"
          },
          "headerName": {
            "type": "string",
            "const": "X-CSRF-TOKEN"
          }
        }
      },
      "CsrfTokenEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "data",
          "requestId"
        ],
        "properties": {
          "code": {
            "type": "string",
            "const": "OK"
          },
          "data": {
            "$ref": "#/components/schemas/CsrfToken"
          },
          "requestId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        }
      },
      "WebLoginRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "loginName",
          "password"
        ],
        "properties": {
          "loginName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "example": "pilot.operator"
          },
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256,
            "writeOnly": true,
            "example": "not-a-real-password"
          }
        }
      },
      "OrganizationSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "organizationCode",
          "displayName"
        ],
        "properties": {
          "organizationCode": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64,
            "example": "HZ-PILOT"
          },
          "displayName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200,
            "example": "湖州试点机构"
          }
        }
      },
      "WebSession": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sessionUid",
          "accountType",
          "subjectUid",
          "displayName",
          "capabilities",
          "organizations",
          "expiresAt",
          "version",
          "authVersion"
        ],
        "properties": {
          "sessionUid": {
            "$ref": "#/components/schemas/UuidV4"
          },
          "accountType": {
            "type": "string",
            "enum": [
              "PLATFORM_ADMIN",
              "TENANT_PRINCIPAL",
              "STAFF"
            ]
          },
          "subjectUid": {
            "$ref": "#/components/schemas/PublicUid"
          },
          "displayName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "contactPhone": {
            "oneOf": [
              {
                "type": "string",
                "maxLength": 32
              },
              {
                "type": "null"
              }
            ]
          },
          "tenantCode": {
            "oneOf": [
              {
                "type": "string",
                "minLength": 1,
                "maxLength": 64
              },
              {
                "type": "null"
              }
            ]
          },
          "capabilities": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[a-z][a-z0-9-]*\\.[a-z][a-z0-9-]*$"
            }
          },
          "organizations": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/OrganizationSummary"
            }
          },
          "expiresAt": {
            "$ref": "#/components/schemas/UtcTimestamp"
          },
          "version": {
            "$ref": "#/components/schemas/ExpectedVersion"
          },
          "authVersion": {
            "$ref": "#/components/schemas/ExpectedVersion"
          }
        }
      },
      "WebSessionEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "data",
          "requestId"
        ],
        "properties": {
          "code": {
            "type": "string",
            "const": "OK"
          },
          "data": {
            "$ref": "#/components/schemas/WebSession"
          },
          "requestId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        }
      },
      "RegistrationSource": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "deploymentCode"
        ],
        "properties": {
          "deploymentCode": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64,
            "example": "HZ-PILOT-BOX-01"
          }
        }
      },
      "MiniappLoginRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "appId",
          "wxLoginCode"
        ],
        "properties": {
          "appId": {
            "type": "string",
            "pattern": "^wx[0-9a-zA-Z]{16}$",
            "example": "wx0000000000000000"
          },
          "wxLoginCode": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256,
            "writeOnly": true,
            "example": "one-time-code-example"
          },
          "registrationSource": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/RegistrationSource"
              },
              {
                "type": "null"
              }
            ]
          }
        }
      },
      "BindMiniappPhoneRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["wechatPhoneCode"],
        "properties": {
          "wechatPhoneCode": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256,
            "writeOnly": true,
            "description": "One-time getPhoneNumber dynamic code; excluded from the stable idempotency fingerprint."
          }
        }
      },
      "MiniappPhoneBinding": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "phoneBound",
          "maskedPhoneNumber",
          "phoneBoundAt"
        ],
        "properties": {
          "phoneBound": {"type": "boolean", "const": true},
          "maskedPhoneNumber": {
            "type": "string",
            "minLength": 3,
            "maxLength": 24
          },
          "phoneBoundAt": {"$ref": "#/components/schemas/UtcTimestamp"}
        }
      },
      "MiniappSessionCreated": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "accessToken",
          "tokenType",
          "audience",
          "entryMode",
          "expiresAt",
          "organization",
          "subjectUid",
          "displayName",
          "capabilities",
          "phoneBound",
          "isNewRegistration"
        ],
        "properties": {
          "accessToken": {
            "type": "string",
            "minLength": 32,
            "readOnly": true,
            "example": "header.payload.signature-example-not-a-real-token"
          },
          "tokenType": {
            "type": "string",
            "const": "Bearer"
          },
          "audience": {
            "type": "string",
            "enum": [
              "miniapp",
              "miniapp-staff"
            ]
          },
          "entryMode": {
            "type": "string",
            "enum": [
              "USER",
              "CLEANING",
              "MANAGEMENT"
            ]
          },
          "expiresAt": {
            "$ref": "#/components/schemas/UtcTimestamp"
          },
          "organization": {
            "$ref": "#/components/schemas/OrganizationSummary"
          },
          "subjectUid": {
            "$ref": "#/components/schemas/PublicUid"
          },
          "displayName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "capabilities": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[a-z][a-z0-9-]*\\.[a-z][a-z0-9-]*$"
            }
          },
          "phoneBound": {
            "type": "boolean"
          },
          "isNewRegistration": {
            "type": "boolean"
          }
        }
      },
      "MiniappSessionView": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "audience",
          "entryMode",
          "expiresAt",
          "organization",
          "subjectUid",
          "displayName",
          "capabilities",
          "phoneBound"
        ],
        "properties": {
