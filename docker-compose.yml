services:
  mysql:
    image: mysql:8.4
    container_name: ecobin-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${ECOBIN_LOCAL_MYSQL_ROOT_PASSWORD:?run tools/development/run-local-stack.ps1}
      MYSQL_DATABASE: ${ECOBIN_LOCAL_MYSQL_DATABASE:-ecobin}
      MYSQL_USER: ${ECOBIN_LOCAL_DB_USERNAME:-ecobin_app}
      MYSQL_PASSWORD: ${ECOBIN_LOCAL_DB_PASSWORD:?run tools/development/run-local-stack.ps1}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ecobin-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: ecobin-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 应用只连接已迁移到目标 V11 的数据库；不会自动建库或迁移。
      - "dbUrl=jdbc:mysql://mysql:3306/${ECOBIN_LOCAL_MYSQL_DATABASE:-ecobin}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai"
      - dbUsername=${ECOBIN_LOCAL_DB_USERNAME:-ecobin_app}
      - dbPassword=${ECOBIN_LOCAL_DB_PASSWORD:?run tools/development/run-local-stack.ps1}
      - SPRING_PROFILES_ACTIVE=local-fake
    ports:
      - "8080:8080"
    volumes:
      - ./.ecobin/application-local-secrets.yml:/app/.ecobin/application-local-secrets.yml:ro
    restart: unless-stopped

  # 前端管理后台：nginx 托管构建产物 + 把 /api 同源反代到 backend
  web:
    build: ./frontend/web
    container_name: ecobin-web
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  ecobin-mysql-data:
