services:
  mysql:
    image: mysql:8.4
    container_name: ecobin-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecobin}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ecobin-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: ecobin-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # F-07 后应用只连接已迁移到目标 V10 的数据库；不会自动建库或迁移。
      - "dbUrl=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ecobin}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai"
      - dbUsername=${DB_RUNTIME_USERNAME:-ecobin_app}
      - dbPassword=${DB_RUNTIME_PASSWORD:?set DB_RUNTIME_PASSWORD in .env}
      - externalMode=fake
      - onenetSubscriptionEnabled=false
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/app/.env:ro
    restart: unless-stopped

  # 前端管理后台：nginx 托管构建产物 + 把 /api 同源反代到 backend
  web:
    build: ./frontend/web
    container_name: ecobin-web
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  ecobin-mysql-data:
