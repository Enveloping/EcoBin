name: ${ECOBIN_COMPOSE_PROJECT_NAME:-ecobin-target}

services:
  backend:
    image: ${ECOBIN_BACKEND_IMAGE:?install and activate a local backend release}
    pull_policy: never
    container_name: ${ECOBIN_BACKEND_CONTAINER_NAME:-ecobin-target-backend}
    user: "10001:10001"
    init: true
    env_file:
      - ${ECOBIN_RUNTIME_ENV_FILE:-/etc/ecobin/runtime.env}
    environment:
      SPRING_PROFILES_ACTIVE: production
      JAVA_TOOL_OPTIONS: >-
        -Xms256m -Xmx640m
        -XX:+ExitOnOutOfMemoryError
        -Djava.io.tmpdir=/tmp
    volumes:
      - type: bind
        source: /run/ecobin-secrets/backend
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ECOBIN_BACKEND_LOG_DIRECTORY:-/var/log/ecobin/backend}
        target: /var/log/ecobin/backend
        read_only: false
        bind:
          create_host_path: false
    networks:
      target-app:
        aliases:
          - backend
      target-db: {}
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/ecobin-backend-healthcheck
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1024m
    mem_reservation: 768m
    cpus: 1.25
    pids_limit: 256
    stop_grace_period: 60s
    restart: unless-stopped

  web:
    image: ${ECOBIN_WEB_IMAGE:?install and activate a local Web release}
    pull_policy: never
    container_name: ${ECOBIN_WEB_CONTAINER_NAME:-ecobin-target-web}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ECOBIN_WEB_LOOPBACK_PORT:-18080}:80"
    networks:
      - target-app
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider --timeout=5 http://127.0.0.1/
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=16m
      - /var/run:rw,nosuid,nodev,size=1m
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  target-app:
    name: ${ECOBIN_APP_NETWORK_NAME:-ecobin-target-app}
    driver: bridge
  target-db:
    name: ${ECOBIN_DB_NETWORK_NAME:-ecobin-target-db}
    external: true
