# Host Nginx is the only public TLS boundary. The target Web container is
# reachable only through 127.0.0.1:18080 and forwards /api to the backend on
# the private Docker application network.

server {
    listen 80;
    listen [::]:80;
    server_name jinshoubao.com;

    return 301 https://www.jinshoubao.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.jinshoubao.com;

    return 301 https://www.jinshoubao.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jinshoubao.com;

    ssl_certificate /etc/letsencrypt/live/www.jinshoubao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jinshoubao.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 只有平台管理员上传不可变业务发布制品的接口允许大请求。关闭请求缓冲，
    # 避免宿主机 Nginx 先把整个发布包写入自己的临时目录。
    location ~ "^/api/v1/web/platform/business-releases/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/artifacts$" {
        client_max_body_size 1537m;
        client_body_timeout 1900s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 1900s;
        proxy_read_timeout 1900s;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the public trust boundary: discard any client-supplied XFF.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
    }
}
