[project]
name = "hardware"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
runtime = [
    "cos-python-sdk-v5>=1.9.44",
    "cryptography>=45.0.0,<47",
    "opencv-python-headless>=4.10.0.84,<5",
    "paho-mqtt>=2.1.0",
    "pyserial>=3.5",
]
enrollment = [
    "cryptography>=45.0.0,<47",
    "requests>=2.34.2",
]
remote-support = [
    "cryptography>=45.0.0,<47",
]
communication = [
    "paho-mqtt>=2.1.0",
]
updater = [
    "cryptography>=45.0.0,<47",
]
dev = [
    { include-group = "runtime" },
    { include-group = "enrollment" },
    { include-group = "remote-support" },
    { include-group = "communication" },
    { include-group = "updater" },
    "python-dotenv>=1.0.0",
    "pytest>=9.0.0,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
