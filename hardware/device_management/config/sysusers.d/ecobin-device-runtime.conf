# Permanent, non-login identities for the device management plane and the
# business runtime. UIDs are assigned by systemd-sysusers and callers resolve
# the stable account names at process start; no image-specific numeric UID is
# embedded in a local protocol allowlist.
g ecobin-communication-ipc - -
g ecobin-business-ipc - -
g ecobin-updater-ipc - -
g ecobin-privileged-helper-ipc - -

u ecobin-communication - "EcoBin permanent communication agent" /var/lib/ecobin/communication /usr/sbin/nologin
u ecobin-business - "EcoBin business runtime" /var/lib/ecobin/business /usr/sbin/nologin
u ecobin-updater - "EcoBin permanent device updater" /var/lib/ecobin/updater /usr/sbin/nologin

# Each owner creates one group-restricted socket and calls the other two.
m ecobin-communication ecobin-communication-ipc
m ecobin-communication ecobin-business-ipc
m ecobin-communication ecobin-updater-ipc
m ecobin-business ecobin-communication-ipc
m ecobin-business ecobin-business-ipc
m ecobin-business ecobin-updater-ipc
m ecobin-business dialout
m ecobin-business video
m ecobin-updater ecobin-communication-ipc
m ecobin-updater ecobin-business-ipc
m ecobin-updater ecobin-updater-ipc
m ecobin-updater ecobin-privileged-helper-ipc
