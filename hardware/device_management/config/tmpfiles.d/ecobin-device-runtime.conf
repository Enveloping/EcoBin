# Databases remain private to their owning process. Each ordinary socket
# directory has its own IPC group; privileged helpers use a fourth group that
# contains only the updater. Socket files also enforce SO_PEERCRED identities.
d /var/lib/ecobin/communication 0700 ecobin-communication ecobin-communication -
d /var/lib/ecobin/business 0700 ecobin-business ecobin-business -
d /var/lib/ecobin/business/photos 0700 ecobin-business ecobin-business -
# Match ecobin-updater.service's StateDirectory owner at the top level so
# systemd does not recursively replace the private child-directory groups.
d /var/lib/ecobin/updater 0700 ecobin-updater ecobin-updater-ipc -
d /var/lib/ecobin/updater/staging 0700 ecobin-updater ecobin-updater -
d /var/lib/ecobin/updater/business-packages 0700 ecobin-updater ecobin-updater -
d /var/lib/ecobin/updater/mcu-firmware 0700 ecobin-updater ecobin-updater -
d /var/lib/ecobin/privileged 0700 root root -
d /var/lib/ecobin/privileged/business-snapshots 0700 root root -
d /var/lib/ecobin/privileged/business-runtime-cutover 0700 root root -
d /opt/ecobin/business 0750 root ecobin-business -
d /opt/ecobin/business/releases 0750 root ecobin-business -
d /run/ecobin/communication 0750 ecobin-communication ecobin-communication-ipc -
d /run/ecobin/business 0750 ecobin-business ecobin-business-ipc -
d /run/ecobin/updater 0750 ecobin-updater ecobin-updater-ipc -
d /run/ecobin/privileged 0750 root ecobin-privileged-helper-ipc -
f /run/ecobin/privileged/mutation.lock 0600 root root -
f /run/ecobin/privileged/business-runtime-cutover.lock 0600 root root -
