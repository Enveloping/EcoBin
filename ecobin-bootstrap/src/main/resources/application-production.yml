# Production is a safety profile, not a shortcut for enabling real external
# channels. externalMode still selects Fake or Real explicitly in runtime.env.
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  forward-headers-strategy: native
  shutdown: graceful

logging:
  # 容器内路径与宿主机持久目录保持一致；控制台日志仍由 Docker 收集。
  file:
    path: ${ecobinLogPath:/var/log/ecobin/backend}

ecobin:
  identity:
    default-platform-admin:
      enabled: ${defaultPlatformAdminEnabled:true}
  observability:
    http-request-logging:
      include-request-body: false
    diagnostic-logging:
      one-net:
        enabled: false
      sql:
        enabled: false
