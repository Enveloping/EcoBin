spring:
  application:
    name: EcoBin

  # 本地读取 Git 忽略的 YAML；生产通过 /run/secrets 只读 config tree 覆盖同名属性。
  config:
    import:
      - optional:file:./.ecobin/application-local-secrets.yml
      - optional:configtree:/run/secrets/

  # 数据源配置
  datasource:
    url: ${dbUrl}
    username: ${dbUsername}
    password: ${dbPassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

# JWT 配置
jwt:
  secret: ${jwtSecret}

# 微信小程序配置（请替换为真实值）
wechat:
  miniapp:
    appid: ${wechatAppid:}
    secret: ${wechatSecret:}

# 中国移动 OneNet 物联网平台
onenet:
  # 上行（北向 MQ 服务端订阅消费）：凭证由本地 YAML 或生产 secret 注入
  subscription:
    broker-url: pulsar+ssl://iot-north-mq.heclouds.com:6651/
    access-id: ${iotAccessId:}
    secret-key: ${iotSecretKey:}
    subscription-name: ${iotSubscriptionName:}
    enabled: ${onenetSubscriptionEnabled:false}
  # 下行（物模型服务调用）：只在 externalMode=real 且配置完整时装配真实客户端
  base-url: https://iot-api.heclouds.com
  product-id: ${onenetProductId:}
  access-key: ${onenetAccessKey:}

# 腾讯云 COS 对象存储（STS 临时密钥，设备直传；只在 REAL 模式使用）
cos:
  secret-id: ${cosSecretId:}
  secret-key: ${cosSecretKey:}
  region: ${cosRegion:}
  bucket-name: ${cosBucketName:}
  base-url: ${cosBaseUrl:}
  duration-seconds: ${cosDurationSeconds:1800}

# 中心可靠任务：三类 worker 使用互斥领取策略和有界容量；数据库轮询是恢复真相
ecobin:
  identity:
    # 机构小程序 AppSecret 的本地版本库；数据库只保存版本引用。
    # 生产可以用同一端口替换为托管秘密设施。
    miniapp-secret-store:
      directory: ${miniappSecretStoreDirectory:./.ecobin/miniapp-secrets}

  observability:
    # 所有环境记录请求到达、响应状态和耗时；生产默认不记录请求体。
    http-request-logging:
      enabled: true
      include-query-string: true
      include-request-body: false
      max-payload-length: 4096
      excluded-path-prefixes:
        - /actuator/health
    # 逐条外部报文和 SQL 诊断默认关闭，只在 local-real 中开启。
    diagnostic-logging:
      one-net:
        enabled: false
        include-payload: true
        include-stack-trace: true
        max-payload-length: 32768
      sql:
        enabled: false
        include-parameter-types: true
        include-stack-trace: true
        max-sql-length: 4096
        slow-query-threshold-ms: 200

  device:
    # 创建设备部署时按型号选择初始硬件档案并发布 v1。
    # 未列出的型号使用 default-profile，便于开发期新增型号后仍能完成部署。
    initial-configuration:
      default-profile: fixed-frame-digital-infrared
      model-profiles:
        EC-M0: fixed-frame-digital-infrared
        ECO-6P: fixed-frame-digital-infrared
        ECOBIN-V1: fixed-frame-digital-infrared
      unit-price-yuan-per-kg: "0.4500"
      fullness-weight-kg: "50.000"

  recycling:
    # 新机构自动发布第一版投递规则：全部投递进入人工审核。
    default-delivery-rule:
      open-balance-floor-cent: -1000
      maximum-review-absolute-weight-gram: 100000
    # 清运员完成后直接形成可修改记录，不进入审核。
    default-clean-rule:
      operation-timeout-seconds: 1800

  # 仅供默认 FAKE 开发运行：空表时创建一个已知平台管理员。
  # REAL/production 必须显式关闭，否则启动失败，不会写入弱默认账号。
  development:
    default-platform-admin:
      enabled: ${defaultPlatformAdminEnabled:true}
      login-name: ${defaultPlatformAdminLogin:admin}
      password: ${defaultPlatformAdminPassword:admin123}
      display-name: ${defaultPlatformAdminDisplayName:开发平台管理员}

  operations:
    reliable:
      workers-enabled: true
      recovery-scan-interval: 30s
      iot-device:
        worker-count: 2
        batch-size: 16
        lease-duration: 30s
        external-timeout: 10s
        maximum-in-flight: 16
        bounded-queue-capacity: 64
        poll-interval: 30s
        initial-backoff: 1s
        maximum-backoff: 5m
        max-auto-attempts: 10
      funds-wechat:
        worker-count: 2
        batch-size: 8
        lease-duration: 60s
        external-timeout: 30s
        maximum-in-flight: 8
        bounded-queue-capacity: 32
        poll-interval: 1s
        initial-backoff: 2s
        maximum-backoff: 10m
        max-auto-attempts: 20
      maintenance:
        worker-count: 1
        batch-size: 4
        lease-duration: 60s
        external-timeout: 20s
        maximum-in-flight: 4
        bounded-queue-capacity: 16
        poll-interval: 5s
        initial-backoff: 5s
        maximum-backoff: 30m
        max-auto-attempts: 10
    telemetry:
      retained-for: 24h
      cleanup-interval: 1h
      cleanup-batch-size: 1000
      maximum-batches: 20

  # F-07：目标纪元与外联模式均参与启动/就绪门禁。
  database:
    epoch:
      test-bypass: false
  external:
    mode: ${externalMode:fake}
    fake:
      block-inbound: true

# 服务器端口
server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,dbEpoch,externalBoundary
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

# 日志
logging:
  # requestId 由最外层 HTTP 过滤器写入 MDC，便于把业务日志和 HTTP_IN/HTTP_OUT 串起来。
  pattern:
    level: "%5p requestId=%X{requestId:-}"
  level:
    org.enveloping.ecobin: INFO
