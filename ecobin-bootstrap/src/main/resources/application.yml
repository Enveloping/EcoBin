spring:
  application:
    name: EcoBin

  # 本地读取 Git 忽略的 YAML；生产通过 /run/secrets 只读 config tree 覆盖同名属性。
  config:
    import:
      - optional:file:./.ecobin/application-local-secrets.yml
      - optional:configtree:/run/secrets/

  # 数据源配置
  datasource:
    url: ${dbUrl}
    username: ${dbUsername}
    password: ${dbPassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# JWT 配置
jwt:
  secret: ${jwtSecret}
  expiration: 86400000  # 24小时 (毫秒)

# 应用加密配置（用于 sys_tenant.miniapp_secret 等敏感字段 AES 加密）
app:
  crypto:
    aes-key: ${appAesKey}

# 微信小程序配置（请替换为真实值）
wechat:
  miniapp:
    appid: ${wechatAppid:}
    secret: ${wechatSecret:}

# 中国移动 OneNet 物联网平台
onenet:
  # 上行（北向 MQ 服务端订阅消费）：凭证由本地 YAML 或生产 secret 注入
  subscription:
    broker-url: pulsar+ssl://iot-north-mq.heclouds.com:6651/
    access-id: ${iotAccessId:}
    secret-key: ${iotSecretKey:}
    subscription-name: ${iotSubscriptionName:}
    enabled: ${onenetSubscriptionEnabled:false}
  # 下行（物模型服务调用）：只在 externalMode=real 且配置完整时装配真实客户端
  base-url: https://iot-api.heclouds.com
  product-id: ${onenetProductId:}
  access-key: ${onenetAccessKey:}

# 腾讯云 COS 对象存储（STS 临时密钥，设备直传；只在 REAL 模式使用）
cos:
  secret-id: ${cosSecretId:}
  secret-key: ${cosSecretKey:}
  region: ${cosRegion:}
  bucket-name: ${cosBucketName:}
  base-url: ${cosBaseUrl:}
  duration-seconds: ${cosDurationSeconds:1800}

# 中心可靠任务：三类 worker 使用互斥领取策略和有界容量；数据库轮询是恢复真相
ecobin:
  # 仅供默认 FAKE 开发运行：空表时创建一个已知平台管理员。
  # REAL/production 必须显式关闭，否则启动失败，不会写入弱默认账号。
  development:
    default-platform-admin:
      enabled: ${defaultPlatformAdminEnabled:true}
      login-name: ${defaultPlatformAdminLogin:admin}
      password: ${defaultPlatformAdminPassword:admin123}
      display-name: ${defaultPlatformAdminDisplayName:开发平台管理员}

  operations:
    reliable:
      workers-enabled: true
      iot-device:
        worker-count: 2
        batch-size: 16
        lease-duration: 30s
        external-timeout: 10s
        maximum-in-flight: 16
        bounded-queue-capacity: 64
        poll-interval: 500ms
        initial-backoff: 1s
        maximum-backoff: 5m
        max-auto-attempts: 10
      funds-wechat:
        worker-count: 2
        batch-size: 8
        lease-duration: 60s
        external-timeout: 30s
        maximum-in-flight: 8
        bounded-queue-capacity: 32
        poll-interval: 1s
        initial-backoff: 2s
        maximum-backoff: 10m
        max-auto-attempts: 20
      maintenance:
        worker-count: 1
        batch-size: 4
        lease-duration: 60s
        external-timeout: 20s
        maximum-in-flight: 4
        bounded-queue-capacity: 16
        poll-interval: 5s
        initial-backoff: 5s
        maximum-backoff: 30m
        max-auto-attempts: 10

  # F-07：目标纪元与外联模式均参与启动/就绪门禁。
  database:
    epoch:
      test-bypass: false
  external:
    mode: ${externalMode:fake}
    fake:
      block-inbound: true

# 服务器端口
server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,dbEpoch,externalBoundary
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

# 日志
logging:
  level:
    org.enveloping.ecobin: INFO
