spring:
  application:
    name: EcoBin

  # 加载项目根目录 .env（实为 Java properties；密钥不入库，仅本地/部署机存放）
  config:
    import: optional:file:./.env[.properties]

  # 数据源配置
  datasource:
    url: ${dbUrl}
    username: ${dbUsername}
    password: ${dbPassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# JWT 配置
jwt:
  secret: ${jwtSecret:EcoBin_JWT_Secret_Key_2026_Must_Be_256_Bits_Long_Change_In_Production!!}
  expiration: 86400000  # 24小时 (毫秒)

# 应用加密配置（用于 sys_tenant.miniapp_secret 等敏感字段 AES 加密）
app:
  crypto:
    aes-key: ${appAesKey:EcoBin_AES_Key_2026_Change_In_Production}

# 微信小程序配置（请替换为真实值）
wechat:
  miniapp:
    appid: ${wechatAppid:}
    secret: ${wechatSecret:}

# 中国移动 OneNet 物联网平台
onenet:
  # 上行（北向 MQ 服务端订阅消费）：凭证由 .env 注入；非测试 + enabled + 凭证齐全才启动消费者
  subscription:
    broker-url: pulsar+ssl://iot-north-mq.heclouds.com:6651/
    access-id: ${iotAccessId:}
    secret-key: ${iotSecretKey:}
    subscription-name: ${iotSubscriptionName:}
    enabled: ${onenetSubscriptionEnabled:false}
  # 下行（物模型服务调用）：只在 externalMode=real 且配置完整时装配真实客户端
  base-url: https://iot-api.heclouds.com
  product-id: ${onenetProductId:}
  access-key: ${onenetAccessKey:}

# 腾讯云 COS 对象存储（STS 临时密钥，设备直传；只在 REAL 模式使用）
cos:
  secret-id: ${cosSecretId:}
  secret-key: ${cosSecretKey:}
  region: ${cosRegion:}
  bucket-name: ${cosBucketName:}
  base-url: ${cosBaseUrl:}
  duration-seconds: ${cosDurationSeconds:1800}

# 服务器端口
server:
  port: 8080

# F-07：目标纪元与外联模式均参与启动/就绪门禁。
ecobin:
  database:
    epoch:
      test-bypass: false
  external:
    mode: ${externalMode:fake}
    fake:
      block-inbound: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,dbEpoch,externalBoundary
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

# 日志
logging:
  level:
    org.enveloping.ecobin: INFO
