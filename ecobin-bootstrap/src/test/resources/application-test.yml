spring:
  datasource:
    url: jdbc:h2:mem:ecobin_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

ecobin:
  operations:
    reliable:
      workers-enabled: false
  database:
    epoch:
      test-bypass: true
  external:
    mode: fake
    fake:
      # 旧 H2 Web 测试仍需直接调用 /api/iot；生产 profile 禁止关闭。
      block-inbound: false

# 应用加密配置（测试占位）
app:
  crypto:
    aes-key: test_aes_key

jwt:
  secret: test_jwt_secret_at_least_32_bytes_long

# OneNet 北向消费者测试环境强制关闭（绝不连真实 MQ）
onenet:
  subscription:
    enabled: false
